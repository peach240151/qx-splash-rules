# ============================================================
# QX 开屏广告拦截 · 懒人配置
# 参考 Orz-3/QuantumultX「Quantumult X 小白配置」结构改写
#   原版：https://github.com/Orz-3/QuantumultX/blob/master/Orz-3.conf
# 规则来源：全部直连上游每日更新源（hwind2021 + 墨鱼），不依赖本仓库快照
# 生成日期：2026-11-16
#
# 【一键导入】
#   QX → 右下角「风车」→「配置文件」→ 右上角 + → 从 URL 下载，粘贴：
#   https://raw.githubusercontent.com/peach240151/qx-splash-rules/main/QX-Lazy.conf
#
# ⚠️ 导入完整「配置文件」会替换你现有的全部配置（节点订阅、策略组、分流等）。
#    导入前请先长按现有配置导出备份。
#    若只想把规则合并进现有配置：把本文件的 [filter_remote]、[rewrite_remote]、
#    [mitm] 三段复制到你自己的 .conf 里即可，不必整份导入。
#
# 【效果】
#   - 分流层（无需 MITM）：hwind Splash-Killer.list + BlockHttpDNS.list，
#     拦截 20+ 广告 SDK 域名并阻断 HTTPDNS 绕过，开屏广告直接加载失败
#   - 重写层（需 MITM）：hwind AdBlock-Splash.conf + 墨鱼去开屏 2.0 StartUpAds.conf，
#     逐 App 开屏接口返回空响应，实现「秒跳过」
#   - 分流 / 重写全部使用上游链接，上游每日更新后 QX 按 update-interval=86400
#     自动拉取最新规则，无需重新导入本配置
#
# 【与 Orz-3 原版的差异】
#   - 去掉依赖机场节点的 [policy] 策略组与 RuleGo 海外分流；本配置不装节点也能用
#   - final 由「黑白名单」改为 direct，避免无节点时无法联网
#   - 只保留开屏相关项，分流 / 重写全部改为上游每日更新链接，
#     不再引用本仓库的一次性合并快照文件
#   - [server_remote] 留空，需要代理时自行添加订阅
# ============================================================

[general]
resource_parser_url = https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js
network_check_url = http://www.apple.com/library/test/success.html
server_check_url = http://cp.cloudflare.com/generate_204
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com
udp_drop_list = 443
fallback_udp_policy = reject
excluded_routes = 239.255.255.250/32
icmp_auto_reply = true

[dns]
server=119.29.29.29
server=180.184.1.1
server=223.5.5.5
server=/dl.google.com/119.29.29.29
server=/dl.l.google.com/119.29.29.29
server=/update.googleapis.com/119.29.29.29
server=/*.dl.playstation.net/119.29.29.29
circumvent-ipv4-answer = 127.0.0.1, 0.0.0.0, 61.160.148.90, 182.43.124.6, 124.236.16.201, 39.102.194.95, 106.74.25.198, 183.192.65.101, 36.135.17.248, 36.135.82.110, 39.105.1.17, 39.130.181.72, 39.130.181.73, 39.173.74.185, 47.92.198.202, 111.22.226.1, 111.28.0.32, 111.31.192.110, 111.44.246.131, 111.56.127.216, 111.63.132.170, 112.15.232.43, 112.17.14.211, 112.54.50.50, 117.156.25.11, 117.187.6.14, 117.187.10.42, 120.202.17.103, 120.204.204.201, 120.209.204.204, 120.222.19.204, 121.4.135.105, 183.203.36.19, 183.203.36.36, 183.207.72.18, 183.213.92.2, 183.220.145.129, 183.252.183.9, 211.137.54.227, 211.137.117.149, 211.137.133.69, 211.138.218.190, 211.139.25.61, 211.139.145.129, 218.201.25.129, 218.201.25.130, 218.203.122.98, 221.130.39.3, 221.180.160.221
circumvent-ipv6-answer = ::

[server_remote]
# 本配置不需要节点。若你已有自己的机场订阅，可按下面格式取消注释并填写：
# https://你的订阅链接, tag=机场, update-interval=172800, enabled=true

[filter_remote]
https://raw.githubusercontent.com/hwind2021/QuantumultX-AdBlock-CN/main/quantumultx/filter/Splash-Killer.list, tag=开屏广告拦截, force-policy=reject, update-interval=86400, enabled=true
https://raw.githubusercontent.com/hwind2021/QuantumultX-AdBlock-CN/main/quantumultx/filter/BlockHttpDNS.list, tag=HTTPDNS阻断, force-policy=reject, update-interval=86400, enabled=true
https://raw.githubusercontent.com/HengLiu2282/DivineEngine/master/Quantumult/Filter/Guard/Advertising.list, tag=神机去广告, force-policy=reject, update-interval=86400, opt-parser=true, enabled=true

[rewrite_remote]
https://raw.githubusercontent.com/hwind2021/QuantumultX-AdBlock-CN/main/quantumultx/rewrite/AdBlock-Splash.conf, tag=hwind开屏重写, update-interval=86400, enabled=true
https://ddgksf2013.top/rewrite/StartUpAds.conf, tag=墨鱼去开屏2.0, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/HengLiu2282/DivineEngine/master/Quantumult/Rewrite/Block/Advertising.conf, tag=神机去广告重写, update-interval=86400, enabled=true
https://raw.githubusercontent.com/peach240151/qx-splash-rules/main/QX-MITM-Hosts.conf, tag=MITM主机名, update-interval=86400, enabled=true

[server_local]

[filter_local]
host-suffix, local, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 100.64.0.0/10, direct
ip-cidr, 224.0.0.0/4, direct
ip6-cidr, fe80::/10, direct
geoip, cn, direct
final, direct

[rewrite_local]

[task_local]

[http_backend]

# [mitm] 主机名统一由 QX-MITM-Hosts.conf 订阅托管（见 [rewrite_remote]），随订阅每日自动更新，无需重导本配置。
[mitm]
skip_validating_cert = true
