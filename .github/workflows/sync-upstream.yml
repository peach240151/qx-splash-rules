name: Sync upstream rules

on:
  schedule:
    # 04:00 Asia/Shanghai (UTC+8) every day
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild rules from upstream
        env:
          QX_ROOT: ${{ github.workspace }}
        run: python scripts/build.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-sync upstream rules"
            git push
          else
            echo "No upstream changes."
          fi
